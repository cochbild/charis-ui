[package]
name = "rust-ui"
version = "0.1.0"
edition = "2021"
description = "A web-inspired, highly customizable retained/declarative UI framework for Rust desktop apps"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
readme = "README.md"
keywords = ["gui", "ui", "desktop", "docking", "widgets"]
categories = ["gui"]
exclude = ["docs/*.png", "tests/golden/*"]

[lib]
name = "rust_ui"

[features]
default = ["window", "gpu", "bundled-fonts", "clipboard", "markdown"]
window = ["dep:winit", "dep:softbuffer"]
bundled-fonts = []
clipboard = ["dep:arboard"]
gpu = ["dep:wgpu", "dep:pollster"]
# Run spawned futures on tokio (needed for tokio-based crates such as reqwest).
tokio = ["dep:tokio"]
serde = ["dep:serde"]
markdown = ["dep:pulldown-cmark"]

[dependencies]
taffy = "0.14"
cosmic-text = "0.19"
tiny-skia = "0.12"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true, default-features = false }
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tiny-skia = "0.12"
serde_json = "1"

[[example]]
name = "showcase"
required-features = ["window"]

[[example]]
name = "dock"
required-features = ["window"]

[[example]]
name = "counter"
required-features = ["window"]
